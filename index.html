<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Flower Bloom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Add Dancing Script for the letter -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Great+Vibes&family=Parisienne&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="assets/webp/watercolor_envelope_transparent.webp" fetchpriority="high" />
    <link rel="stylesheet" href="styles.css">
    
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
</head>
<body>
    <div class="background-container"></div>
    
    <main class="content-wrapper">
        <!-- The flower container will hold the 40 generated flowers -->
        <div id="flower-container"></div>

        <!-- The initial envelope -->
        <div class="envelope-container" id="envelope">
            <div class="glow"></div>
            <img src="assets/webp/watercolor_envelope_transparent.webp" alt="" class="envelope-image" width="250" height="200" fetchpriority="high" decoding="async" />
            <p class="tap-text">Tap to open</p>
        </div>

        <!-- Legacy letter (replaced by finale scene); kept for structure if needed -->
        <div id="letter-card" hidden aria-hidden="true"></div>

        <!-- After flower animation: dim overlay + bouquet + message (stamp card) -->
        <div id="finale-root" class="finale-root" aria-hidden="true">
            <div id="finale-overlay" class="finale-overlay"></div>
            <div id="finale-scene" class="finale-scene">
                <div class="finale-layout">
                    <div class="finale-bouquet-col">
                        <div id="finale-sparkles" class="finale-sparkles" aria-hidden="true"></div>
                        <img
                            src="assets/webp/pink_boquet.webp"
                            alt=""
                            class="finale-bouquet-img"
                            width="360"
                            height="420"
                            loading="lazy"
                            decoding="async"
                        />
                    </div>
                    <div class="finale-scroll-spacer" aria-hidden="true"></div>
                    <div class="finale-letter-block">
                        <div class="finale-message finale-message--stamp" id="finale-message">
                            <p class="finale-meta">
                                <span class="finale-meta-line">To: Rere el mozza</span>
                                <span class="finale-meta-line">From: Rozza</span>
                            </p>
                            <div class="finale-message-inner">
                                <p class="finale-handwritten">
                                    My baby,<br><br>
                                    kan nefsy awi akont m3aky el nahrda. I hope what i did for you makes you happy.<br><br>
                                    With love,
                                </p>
                            </div>
                            <div class="finale-mini-stamp" aria-hidden="true"></div>
                        </div>
                        <aside class="finale-polaroid-stack" aria-label="Photos">
                            <figure class="finale-polaroid finale-polaroid--1">
                                <span class="finale-pin finale-pin--photo" aria-hidden="true"></span>
                                <div class="finale-polaroid-frame">
                                    <img src="assets/webp/finale-photo-1.webp" alt="" width="120" height="120" loading="lazy" decoding="async" />
                                </div>
                            </figure>
                            <figure class="finale-polaroid finale-polaroid--2">
                                <span class="finale-pin finale-pin--photo" aria-hidden="true"></span>
                                <div class="finale-polaroid-frame">
                                    <img src="assets/webp/finale-photo-2.webp" alt="" width="120" height="120" loading="lazy" decoding="async" />
                                </div>
                            </figure>
                            <figure class="finale-polaroid finale-polaroid--3">
                                <span class="finale-pin finale-pin--photo" aria-hidden="true"></span>
                                <div class="finale-polaroid-frame">
                                    <img src="assets/webp/finale-photo-3.webp" alt="" width="120" height="120" loading="lazy" decoding="async" />
                                </div>
                            </figure>
                        </aside>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
